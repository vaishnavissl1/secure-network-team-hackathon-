name: shield-wall

services:
  juice-shop:
    image: bkimminich/juice-shop@sha256:adaf6a6ca50f772dff7d2fe56972c659e81a61e0dbbe607c2b39fefd436e6153
    pull_policy: never
    networks: [backend]
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - >-
          require('node:http').get('http://127.0.0.1:3000/', response => {
            response.resume();
            process.exit(response.statusCode === 200 ? 0 : 1);
          }).on('error', () => process.exit(1))
      start_period: 45s
      interval: 3s
      timeout: 3s
      retries: 20

  waf:
    image: owasp/modsecurity-crs@sha256:697812147e7eada5c668e9728c6439d4663476c69f68635d24fb7878aac0f26a
    pull_policy: never
    depends_on:
      juice-shop:
        condition: service_healthy
        restart: true
    environment:
      BACKEND: http://juice-shop:3000
      SERVER_NAME: shield.local
      PORT: "8080"
      SSL_PORT: "8443"
      SSL_PROTOCOLS: TLSv1.2 TLSv1.3
      ACCESSLOG: /dev/null
      MODSEC_RULE_ENGINE: ${SHIELD_RULE_ENGINE:-On}
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_PARTS: AHZ
      MODSEC_AUDIT_LOG_RELEVANT_STATUS: "^403$"
      MODSEC_AUDIT_LOG: /var/log/modsecurity/audit/audit.log
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./certs/server.crt:/etc/nginx/conf/server.crt:ro
      - ./certs/server.key:/etc/nginx/conf/server.key:ro
      - ./waf/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./waf/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
      - ./waf/nginx-ratelimit.conf:/etc/nginx/conf.d/00-shield-rate.conf:ro
      - type: bind
        source: ./logs/nginx/access.log
        target: /var/log/modsecurity/audit/access.log
        bind:
          create_host_path: false
      - type: bind
        source: ./logs/modsec/audit.log
        target: /var/log/modsecurity/audit/audit.log
        bind:
          create_host_path: false
    networks: [edge, backend]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-A", "shield-wall-healthcheck", "--cacert", "/etc/nginx/conf/server.crt", "https://localhost:8443/healthz"]
      interval: 3s
      timeout: 3s
      retries: 10

networks:
  edge: {}
  backend:
    internal: true
