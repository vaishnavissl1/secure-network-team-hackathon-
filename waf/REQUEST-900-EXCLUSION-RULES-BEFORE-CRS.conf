# ============================================================================
# ModSecurity override / tuning file  (loaded BEFORE the CRS rules)
# ----------------------------------------------------------------------------
# This is the OWASP-recommended place for runtime rule exclusions used to
# remove FALSE POSITIVES. Do NOT edit the CRS rule files directly.
#
# Rules here use runtime `ctl:ruleRemoveById` and MUST be path-scoped so we
# only relax a rule for the exact endpoint that needs it -- never globally.
# This keeps the WAF strict against the judges' *variant* attacks.
#
# Template (add one per confirmed false positive, with the real rule id):
#
#   SecRule REQUEST_URI "@beginsWith /rest/EXAMPLE" \
#       "id:10001,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=NNNNNN"
#
# Exclusions get filled in during the tuning phase, from real log evidence.
# ============================================================================
