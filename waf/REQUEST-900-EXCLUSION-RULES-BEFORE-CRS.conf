# Juice Shop's Engine.IO client posts text frames to the polling endpoint.
# Restrict the content-type policy change to that specific request shape.
SecRule REQUEST_FILENAME "@streq /socket.io/" "id:1000101,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,chain"
    SecRule ARGS:transport "@streq polling" "t:none,chain"
    SecRule ARGS:EIO "@streq 4" "t:none,chain"
    SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^text/plain(?:\s*;\s*charset=utf-8)?$" "t:none,setvar:'tx.allowed_request_content_type=|text/plain|'"
